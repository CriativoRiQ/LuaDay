#dust,#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#dust{z-index:0}#confetti{z-index:80}
.aura{position:fixed;z-index:0;pointer-events:none;border-radius:50%;filter:blur(90px);opacity:.38}
.aura.a{width:min(560px,90vw);height:min(560px,90vw);background:radial-gradient(circle,#f4cc6066,transparent 70%);top:-22vh;right:-25vw;animation:drift 16s ease-in-out infinite alternate}
.aura.b{width:min(460px,80vw);height:min(460px,80vw);background:radial-gradient(circle,#ddae3944,transparent 70%);bottom:-18vh;left:-25vw;animation:drift 20s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(-40px,40px) scale(1.12)}}
/* barra superior */
.bar{position:sticky;top:0;z-index:30;padding-top:var(--sat);transition:background .35s,border-color .35s;border-bottom:.5px solid transparent}
.bar.solid{background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border-bottom-color:var(--sep)}
.bar-in{max-width:1080px;margin:0 auto;height:56px;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 max(18px,var(--sar)) 0 max(18px,var(--sal))}
.bar .lua-s{width:40px;height:40px}
.spons{display:flex;align-items:center;gap:10px;text-align:right}
.spons small{font-size:10px;line-height:1.15;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--l2)}
.spons .riq{height:26px}
main{position:relative;overflow-x:clip;z-index:2;max-width:1080px;margin:0 auto;padding:8px max(18px,var(--sar)) calc(116px + var(--sab)) max(18px,var(--sal))}
.badge{display:none;margin:6px 0 0;width:fit-content;font-size:12px;font-weight:500;color:var(--l2);background:var(--fill2);border-radius:999px;padding:5px 11px}
.badge.show{display:block}
.view{display:none}
.view.on{display:block;animation:vin .55s var(--spring)}
@keyframes vin{from{opacity:0;transform:translateY(14px) scale(.985)}}
.kicker{font-size:13px;font-weight:600;color:var(--gold);letter-spacing:.02em}
.large{font-size:clamp(32px,8.4vw,52px);font-weight:800;letter-spacing:-.035em;line-height:1.04;margin:6px 0 10px}
.large .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--l2);font-size:clamp(15px,4vw,17px);line-height:1.5;max-width:520px}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:14px 0 18px}
.title-row .large{margin:0}
.link{color:var(--gold);font-weight:500;font-size:17px;padding:6px 2px}
/* participar */
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:26px;align-items:center;margin-top:10px}
@media(min-width:900px){.hero-grid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px;margin-top:34px}}
.hero{text-align:center}
@media(min-width:900px){.hero{text-align:left}}
.hero .sub{margin:0 auto}
@media(min-width:900px){.hero .sub{margin:0}}
.logo-big{position:relative;width:clamp(112px,32vw,190px);aspect-ratio:1;margin:4px auto 18px}
@media(min-width:900px){.logo-big{margin:0 0 22px}}
.logo-big svg{position:relative;width:100%;height:100%;animation:float 6s ease-in-out infinite;filter:drop-shadow(0 12px 30px rgba(244,204,96,.28))}
.logo-big::before{content:"";position:absolute;inset:-14%;border-radius:50%;background:conic-gradient(from 0deg,transparent,rgba(249,217,120,.35),transparent 40%,rgba(221,174,57,.3),transparent 75%);filter:blur(18px);animation:rot 10s linear infinite}
@keyframes float{50%{transform:translateY(-7px) rotate(-3deg)}}
@keyframes rot{to{transform:rotate(360deg)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;justify-content:center}
@media(min-width:900px){.chips{justify-content:flex-start}}
.chips span{font-size:13px;font-weight:500;color:var(--l2);background:var(--fill2);border-radius:999px;padding:6px 13px;opacity:0;animation:chip .6s var(--spring) forwards}
.chips span:nth-child(2){animation-delay:.08s}.chips span:nth-child(3){animation-delay:.16s}.chips span:nth-child(4){animation-delay:.24s}
@keyframes chip{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}
.card{position:relative;background:rgba(28,28,30,.82);-webkit-backdrop-filter:blur(30px) saturate(160%);backdrop-filter:blur(30px) saturate(160%);border:.5px solid rgba(255,255,255,.08);border-radius:26px;padding:22px clamp(18px,5vw,28px) 24px;box-shadow:0 30px 70px -30px rgba(0,0,0,.9)}
.segs{display:flex;gap:6px;margin-bottom:18px}
.segs span{flex:1;height:4px;border-radius:4px;background:var(--fill);overflow:hidden}
.segs span i{display:block;height:100%;width:0;background:var(--grad);border-radius:4px;transition:width .6s var(--spring)}
.segs span.done i{width:100%}
.form-top{display:flex;justify-content:space-between;align-items:center;min-height:30px;margin-bottom:6px}
.back{display:flex;align-items:center;gap:2px;color:var(--gold);font-size:17px;padding:4px 8px 4px 0;transition:opacity .3s}
.back svg{width:12px;height:20px}
.back.hide{opacity:0;pointer-events:none}
.count{font-size:13px;color:var(--l3);font-weight:600;font-variant-numeric:tabular-nums}
.steps{display:grid;overflow:hidden;padding:3px;margin:-3px}
.step{grid-area:1/1;opacity:0;visibility:hidden;transform:translateX(28px);transition:opacity .45s var(--spring),transform .55s var(--spring),visibility 0s .55s}
.step.on{opacity:1;visibility:visible;transform:none;transition:opacity .45s var(--spring),transform .55s var(--spring),visibility 0s}
.step.past{transform:translateX(-28px)}
.step h2{font-size:clamp(24px,6.6vw,30px);font-weight:700;letter-spacing:-.025em;line-height:1.12;margin-bottom:6px}
.step p{font-size:15px;color:var(--l2);margin-bottom:18px}
.inp{position:relative;display:flex;align-items:center;background:var(--fill);border-radius:14px;height:56px;padding:0 16px;transition:box-shadow .25s,background .25s}
.inp:focus-within{box-shadow:0 0 0 2px var(--gold);background:rgba(118,118,128,.3)}
.inp input{flex:1;min-width:0;height:100%;background:transparent;border:0;outline:none;font-size:17px;caret-color:var(--gold)}
.inp input::placeholder{color:var(--l3)}
.inp .pre{color:var(--gold);font-size:17px;font-weight:600;margin-right:2px}
.inp .clr{width:22px;height:22px;border-radius:50%;background:rgba(235,235,245,.3);display:none;place-items:center;flex:0 0 auto}
.inp .clr svg{width:9px;height:9px}
.inp.has .clr{display:grid}
.err{font-size:13px;color:var(--red);min-height:19px;margin-top:8px;padding-left:4px}
.shake{animation:shake .42s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.optrow{display:flex;align-items:center;gap:14px;background:var(--fill2);border-radius:14px;padding:13px 14px;margin-top:12px;cursor:pointer}
.optrow span{flex:1;font-size:14px;line-height:1.35;color:var(--l2)}
.sw{position:relative;flex:0 0 51px;width:51px;height:31px;border-radius:999px;background:rgba(120,120,128,.32);transition:background .3s;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.25),0 0 1px rgba(0,0,0,.2);transition:transform .35s var(--spring)}
.sw:checked{background:var(--gold)}
.sw:checked::after{transform:translateX(20px)}
.btn{position:relative;overflow:hidden;width:100%;height:56px;border-radius:16px;background:var(--grad);color:#241a00;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;box-shadow:0 14px 30px -14px rgba(244,204,96,.75);transition:transform .2s var(--spring),filter .2s}
.btn:active{transform:scale(.97);filter:brightness(.92)}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:shine 3.4s infinite}
@keyframes shine{0%,62%{left:-60%}100%{left:130%}}
.btn[disabled]{opacity:.65;pointer-events:none}
.btn.auto{width:auto;padding:0 26px;margin-top:0}
.tint{height:50px;border-radius:14px;padding:0 20px;background:rgba(244,204,96,.14);color:var(--gold);font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .2s var(--spring),background .2s}
.tint:active{transform:scale(.96);background:rgba(244,204,96,.22)}
.tint svg{width:18px;height:18px}
.spin{width:20px;height:20px;border:2.5px solid rgba(36,26,0,.25);border-top-color:#241a00;border-radius:50%;animation:rot .7s linear infinite}
.kbd-hint{display:none;text-align:center;font-size:12px;color:var(--l3);margin-top:12px}
@media(hover:hover) and (pointer:fine){.kbd-hint{display:block}}
/* bilhete estilo Wallet */
.ticket{display:none;text-align:center}
.ticket.on{display:block}
.pass{position:relative;max-width:360px;margin:6px auto 0;border-radius:20px;overflow:hidden;text-align:left;background:linear-gradient(165deg,#2b220f 0%,#16130c 45%,#0e0d0b 100%);border:.5px solid rgba(249,217,120,.35);box-shadow:0 30px 60px -24px rgba(0,0,0,.95),0 0 0 .5px rgba(255,255,255,.04) inset;animation:passIn 1s var(--spring) both}
@keyframes passIn{from{opacity:0;transform:translateY(60%) scale(.88) rotateX(25deg)}}
.pass::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.13) 45%,transparent 60%);transform:translateX(-100%);animation:gloss 1.6s .9s var(--spring) forwards;pointer-events:none}
@keyframes gloss{to{transform:translateX(100%)}}
.pass-top{display:flex;align-items:center;gap:10px;padding:16px 18px 0}
.pass-top svg{width:34px;height:34px;flex:0 0 auto}
.pass-top .t{flex:1;line-height:1.15}
.pass-top .t b{display:block;font-size:15px}
.pass-top .t span{font-size:12px;color:var(--l2)}
.pass-top .r{text-align:right;line-height:1.15}
.cap{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.pass-top .r b{font-size:14px}
.pass-num{padding:18px 18px 6px}
.pass .big{font-family:var(--rd);font-weight:900;font-size:clamp(76px,24vw,98px);line-height:1;margin-top:2px;letter-spacing:-.02em}
.pass-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 18px 16px}
.pass-fields b{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pass-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;border-top:.5px dashed rgba(249,217,120,.3);background:rgba(0,0,0,.25)}
.pass-foot small{font-size:11px;color:var(--l2);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.pass-foot .riq{height:24px}
.ticket h3{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:22px 0 6px}
.ticket p{color:var(--l2);font-size:15px;line-height:1.5;max-width:340px;margin:0 auto}
.ticket .tint{margin-top:18px}
/* rolos */
.reels{display:inline-flex;gap:.04em}
.reel{height:1em;overflow:hidden}
.strip{display:flex;flex-direction:column;will-change:transform}
.strip span{display:block;height:1em;line-height:1em;width:.62em;text-align:center;background:linear-gradient(180deg,#fff4cf 0%,#f9d978 35%,#f4cc60 60%,#ddae39 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
/* patrocinador */
.sponsor-card{display:flex;align-items:center;gap:16px;margin-top:22px;padding:16px 18px;border-radius:20px;background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:.5px solid rgba(255,255,255,.08)}
.sponsor-card .riq{height:44px;flex:0 0 auto}
.sponsor-card div{line-height:1.25}
.sponsor-card small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.sponsor-card b{font-size:15px;font-weight:600}

/* leads */
.widgets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.widget{background:var(--card);border-radius:20px;padding:14px 14px 12px;min-width:0}
.widget b{display:block;font-family:var(--rd);font-weight:900;font-size:clamp(28px,8vw,38px);line-height:1.05;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.widget span{font-size:12.5px;color:var(--l2);font-weight:500}
.tools{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;background:var(--fill)}
.search svg{width:17px;height:17px;flex:0 0 auto;color:var(--l2)}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:17px}
.search input::placeholder{color:var(--l2)}
.tools .tint{height:40px;font-size:15px;padding:0 14px;border-radius:12px}
.group-h{font-size:13px;color:var(--l2);text-transform:uppercase;letter-spacing:.02em;margin:22px 0 8px 16px}
.group{background:var(--card);border-radius:16px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 16px;opacity:0;animation:rin .45s var(--spring) forwards}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:72px;border-top:.5px solid var(--sep)}
@keyframes rin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.num{flex:0 0 auto;min-width:44px;height:44px;padding:0 6px;border-radius:12px;display:grid;place-items:center;font-family:var(--rd);font-weight:900;font-size:15px;color:#241a00;background:var(--grad)}
.row.win .num{box-shadow:0 0 0 2px #000,0 0 0 3.5px var(--gold)}
.info{flex:1;min-width:0;line-height:1.25}
.info b{display:block;font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info span{display:block;font-size:13.5px;color:var(--l2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info span a{color:var(--l2)}
.row time{font-size:13px;color:var(--l3);flex:0 0 auto;font-variant-numeric:tabular-nums}
.minus{flex:0 0 auto;width:0;height:22px;border-radius:50%;background:var(--red);display:grid;place-items:center;overflow:hidden;opacity:0;margin-right:-12px;transition:width .35s var(--spring),opacity .3s,margin .35s var(--spring),transform .3s var(--spring)}
.minus::after{content:"";width:10px;height:2px;border-radius:2px;background:#fff}
.editing .minus{width:22px;opacity:1;margin-right:0}
.row.armed .minus{transform:rotate(-90deg)}
.apagar{flex:0 0 auto;max-width:0;overflow:hidden;white-space:nowrap;height:36px;border-radius:10px;background:var(--red);color:#fff;font-size:15px;font-weight:600;padding:0;transition:max-width .35s var(--spring),padding .35s var(--spring)}
.row.armed .apagar{max-width:120px;padding:0 14px}
.row.armed time{display:none}
.empty{text-align:center;color:var(--l2);font-size:15px;padding:44px 22px;line-height:1.5}
.empty svg{width:44px;height:44px;margin:0 auto 12px;color:var(--l3)}
@media(max-width:380px){.row time{display:none}.widget{padding:12px 10px}.widget span{font-size:11.5px}}
/* sorteio */
.stage{text-align:center;padding:26px 16px 24px;overflow:hidden}
.stage .reels{font-family:var(--rd);font-weight:900;font-size:clamp(92px,27vw,190px);line-height:1;filter:drop-shadow(0 8px 30px rgba(244,204,96,.32));margin-top:10px}
.stage.rolling .reels{animation:pulse .45s ease-in-out infinite alternate}
@keyframes pulse{to{filter:drop-shadow(0 8px 60px rgba(244,204,96,.65))}}
.winner{min-height:92px;margin-top:12px}
.winner .cap{opacity:0;transition:opacity .5s}
.winner .nm{font-size:clamp(26px,7vw,40px);font-weight:800;letter-spacing:-.03em;margin-top:4px;opacity:0;transform:translateY(14px) scale(.96);filter:blur(8px);transition:all .8s var(--spring)}
.winner .ig{color:var(--l2);font-size:15px;margin-top:2px;opacity:0;transition:opacity .7s .25s}
.winner.show .cap,.winner.show .ig{opacity:1}
.winner.show .nm{opacity:1;transform:none;filter:none}
.ring{position:absolute;left:50%;top:40%;width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:50%;border:2px solid var(--goldl);opacity:0;pointer-events:none}
.ring.go{animation:ring 1.1s ease-out}
@keyframes ring{from{opacity:.9;transform:scale(.35)}to{opacity:0;transform:scale(2.6)}}
.ctrls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.ctrls .btn{max-width:260px}
.ctrls .tint{height:56px;border-radius:16px}
@media(max-width:520px){.ctrls{flex-direction:column;align-items:stretch}.ctrls .btn{max-width:none}}
.setrow{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;cursor:pointer}
.setrow span{flex:1;font-size:16px}
.setrow+.setrow{border-top:.5px solid var(--sep)}
.setrow .v{flex:0 0 auto;color:var(--l2);font-size:16px}
.hrow{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:60px}
.hrow+.hrow{border-top:.5px solid var(--sep)}
.hrow .info span{white-space:nowrap}
.medal{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--gold);background:rgba(244,204,96,.14);border-radius:999px;padding:4px 9px}
/* rodapé */
footer{text-align:center;margin-top:46px;padding-top:26px;border-top:.5px solid var(--sep)}
footer .ft{display:flex;flex-direction:column;align-items:center;gap:8px}
footer small.k{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
footer .riq{height:46px}
footer p{font-size:12.5px;color:var(--l2);line-height:1.6;margin-top:12px;padding:0 10px}
footer p.ev{color:var(--l3);margin-top:2px;font-size:12px}
/* tab bar flutuante */
.tabbar{position:fixed;z-index:40;left:50%;bottom:calc(10px + var(--sab));transform:translateX(-50%);width:min(400px,calc(100% - 24px - var(--sal) - var(--sar)));height:64px;display:flex;padding:5px;border-radius:32px;background:rgba(30,30,32,.7);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);border:.5px solid rgba(255,255,255,.12);box-shadow:0 18px 40px -12px rgba(0,0,0,.85)}
.tabbar .hl{position:absolute;top:5px;bottom:5px;border-radius:27px;background:rgba(255,255,255,.1);transition:left .5s var(--spring),width .5s var(--spring)}
.tabbar button{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--l2);font-size:10.5px;font-weight:600;letter-spacing:0;transition:color .3s,transform .2s var(--spring)}
.tabbar button:active{transform:scale(.9)}
.tabbar button.on{color:var(--gold)}
.tabbar .ic{position:relative;width:26px;height:24px}
.tabbar .ic svg{width:26px;height:24px}
.tabbar .lk{position:absolute;right:-7px;bottom:-3px;width:14px;height:14px;border-radius:50%;background:#3a3a3c;display:grid;place-items:center;transition:transform .3s var(--spring)}
.tabbar .lk svg{width:8px;height:8px;color:#fff}
.unlocked .tabbar .lk{transform:scale(0)}
/* folhas (sheets) */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,0);pointer-events:none;visibility:hidden;transition:background .4s,visibility 0s .55s}
.sheet.on{background:rgba(0,0,0,.55);pointer-events:auto;visibility:visible;transition:background .4s,visibility 0s}
.panel{width:100%;max-width:520px;background:#1c1c1e;border-radius:22px 22px 0 0;padding:10px 20px calc(22px + var(--sab));transform:translateY(105%);transition:transform .5s var(--spring);max-height:92vh;max-height:92dvh;overflow:auto}
.sheet.on .panel{transform:none}
@media(min-width:700px){.sheet{align-items:center}.panel{border-radius:22px;padding-bottom:24px;transform:translateY(40px) scale(.96);opacity:0;transition:transform .45s var(--spring),opacity .3s}.sheet.on .panel{opacity:1}}
.grab{width:36px;height:5px;border-radius:3px;background:rgba(235,235,245,.3);margin:0 auto 14px}
.panel h3{font-size:20px;font-weight:700;text-align:center;letter-spacing:-.02em}
.panel p{font-size:14px;color:var(--l2);text-align:center;margin:4px 0 18px}
.dots{display:flex;justify-content:center;gap:18px;margin:8px 0 22px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--l1);transition:background .15s,transform .2s var(--spring)}
.dots i.f{background:var(--l1);transform:scale(1.08)}
.keys{display:grid;grid-template-columns:repeat(3,min(78px,22vw));justify-content:center;gap:clamp(12px,4vw,18px) clamp(18px,7vw,28px)}
.keys button{width:min(78px,22vw);aspect-ratio:1;border-radius:50%;background:rgba(118,118,128,.28);font-size:clamp(28px,8vw,34px);font-weight:400;display:grid;place-items:center;transition:background .25s}
.keys button:active{background:rgba(235,235,245,.45);transition:none}
.keys button.txt{background:none;font-size:17px;font-weight:500}
.keys button.txt svg{width:28px;height:22px}
.panel textarea{width:100%;height:190px;border-radius:12px;background:var(--fill);border:0;outline:none;padding:12px;font:12.5px/1.5 ui-monospace,Menlo,monospace;color:var(--l1);resize:none}
.panel .tint{width:100%;margin-top:12px}
/* toast estilo Dynamic Island */
.island{position:fixed;z-index:90;left:50%;top:calc(10px + var(--sat));transform:translate(-50%,-140%) scale(.6);display:flex;align-items:center;gap:10px;max-width:min(92vw,440px);padding:11px 18px 11px 12px;border-radius:999px;background:#000;border:.5px solid rgba(255,255,255,.14);box-shadow:0 16px 40px rgba(0,0,0,.6);font-size:14px;font-weight:500;opacity:0;transition:transform .55s var(--spring),opacity .35s}
.island.on{transform:translate(-50%,0) scale(1);opacity:1}
.island i{flex:0 0 24px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--green)}
.island i svg{width:13px;height:13px;color:#000}
.island.info i{background:var(--gold)}.island.err i{background:var(--red)}
.island.err i svg{color:#fff}
.bar-in{position:relative}
.qrbtn{position:absolute;right:max(14px,var(--sar));top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--gold);transition:transform .2s var(--spring),background .2s}
.qrbtn:active{transform:translateY(-50%) scale(.9);background:rgba(118,118,128,.4)}
.qrbtn svg{width:20px;height:20px}
.qrbtn::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--gold);opacity:0;animation:qrp 2.6s ease-out infinite}
@keyframes qrp{0%{opacity:.7;transform:scale(.85)}70%,100%{opacity:0;transform:scale(1.25)}}
.qrcard{width:min(300px,78vw);margin:0 auto;background:#fff;border-radius:26px;padding:16px 16px 12px;box-shadow:0 20px 50px -20px rgba(244,204,96,.45);transform:scale(.9);opacity:0;transition:transform .55s var(--spring) .08s,opacity .3s .08s}
#qrSheet.on .qrcard{transform:none;opacity:1}
.qrcard .qr svg{width:100%;height:auto;border-radius:10px}
.qrcard .qrcap{display:flex;align-items:center;justify-content:center;gap:8px;color:#1c1c1e;font-size:14px;font-weight:700;margin-top:8px}
.qrcard .qrcap svg{width:26px;height:26px}
.qrempty{aspect-ratio:1;display:grid;place-items:center;text-align:center;color:#6b6b70;font-size:14px;line-height:1.45;padding:24px;border:2px dashed #d1d1d6;border-radius:14px}
.qrurl{text-align:center;font-size:13px;color:var(--l2);margin:14px auto 0;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qract{display:flex;gap:10px;margin-top:14px}
.qract .tint{flex:1;margin-top:0;width:auto}
.qredit{display:none;margin-top:14px}
.qredit.on{display:block}
.qredit .inp{height:50px}
.qredit .inp input{font-size:16px}
.qredit .btn{height:50px;margin-top:10px}
.lform .inp{margin-top:10px}.lform .inp input{font-size:16px}.lform .btn{margin-top:6px}.lform .err{text-align:center;padding:0}
#acc{display:none}.fb #acc{display:block}
a.setrow{color:var(--l1)}.setrow .v.g{color:var(--gold)}.setrow.red span{color:var(--red)}
.live{display:inline-flex;align-items:center;gap:6px}.live:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(48,209,88,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(48,209,88,0)}100%{box-shadow:0 0 0 0 rgba(48,209,88,0)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

}
function csv(){var rows=[['Numero','Nome','Telefone','Instagram','Data']];state.leads.slice().sort(function(a,b){return a.n-b.n}).forEach(function(l){rows.push([pad(l.n),l.nome,maskTel(l.tel),l.ig?'@'+l.ig:'',fmtT(l.t)])});return rows.map(function(r){return r.map(function(c){c=String(c);return /[",;\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(';')}).join('\r\n')}
$('#csv').onclick=function(){var t=csv(),p;if(!inClaude()){try{var bl=new Blob(['\ufeff'+t],{type:'text/csv;charset=utf-8'}),a=document.createElement('a'),dt=new Date();a.href=URL.createObjectURL(bl);a.download='sorteio-luaday-leads-'+dt.toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);toast('Planilha baixada ('+state.leads.length+' inscrições)');return}catch(e){}}try{p=navigator.clipboard.writeText(t)}catch(e){p=Promise.reject(e)}Promise.resolve(p).then(function(){toast('Planilha copiada — cole no Excel ou Sheets')},function(){$('#csvTxt').value=t;openSheet('#csvSheet');setTimeout(function(){$('#csvTxt').select()},300)})};
$('#csvClose').onclick=function(){closeSheet('#csvSheet')};

/* sorteio */
var reels=null,cur=null,rolling=false;
function poolArr(){var won={};state.winners.forEach(function(w){won[w.n]=1});return state.leads.filter(function(l){return !($('#noRep').checked&&won[l.n])})}
function renderSorteio(){
  var n=pad(0).length;if(!reels||reels.length!==n){$('#reels').innerHTML='';reels=buildReels($('#reels'),n)}
  $('#pool').textContent=poolArr().length;
  var h=$('#hist');if(!state.winners.length){h.innerHTML='';return}
  h.innerHTML='<div class="group-h">Ganhadoras registradas</div><div class="group">'+state.winners.slice().reverse().map(function(w,i){return '<div class="hrow"><div class="num">'+pad(w.n)+'</div><div class="info"><b>'+escH(w.nome)+'</b><span>'+(w.ig?'@'+escH(w.ig)+' · ':'')+fmtT(w.t)+'</span></div><span class="medal">'+(state.winners.length-i)+'º</span></div>'}).join('')+'</div>';
}
$('#noRep').addEventListener('change',function(){haptic(5);renderSorteio()});
$('#draw').onclick=function(){
  if(rolling)return;var pool=poolArr();if(!pool.length){toast('Não há participantes disponíveis.','info');return}
  rolling=true;haptic(10);cur=pool[rnd(pool.length)];var w=$('#winner');w.classList.remove('show');$('#save').style.display='none';
  $('#draw').disabled=true;$('#stage').classList.add('rolling');
  var t=pad(cur.n);if(reels.length!==t.length){$('#reels').innerHTML='';reels=buildReels($('#reels'),t.length)}
  var durs=reels.map(function(_,i){return 2.4+i*.8});spinReels(reels,t,durs);
  var tick=setInterval(function(){haptic(3)},180);
  setTimeout(function(){
    clearInterval(tick);$('#stage').classList.remove('rolling');$('#wName').textContent=cur.nome;$('#wIg').textContent=(cur.ig?'@'+cur.ig+' · ':'')+'nº '+t;
    w.classList.add('show');var r=$('#ring');r.classList.remove('go');void r.offsetWidth;r.classList.add('go');confetti(2.2);haptic([30,60,30]);
    $('#draw').disabled=false;$('#draw span').textContent='Sortear de novo';$('#save').style.display='';rolling=false;
  },durs[durs.length-1]*1000+150);
};
$('#save').onclick=function(){
  if(!cur)return;askPin('Confirmar ganhadora','Digite o código para registrar '+cur.nome,registerWinner);
};
function registerWinner(){
  if(mode==='fb'){$('#save').textContent='Salvando…';FB.F.addDoc(FB.F.collection(FB.db,'ganhadoras'),{n:cur.n,nome:cur.nome,ig:cur.ig||'',tel:cur.tel,t:Date.now(),por:fbUser?fbUser.email:''}).then(function(){$('#save').textContent='Registrar ganhadora';$('#save').style.display='none';toast(cur.nome+' registrada como ganhadora')},function(){$('#save').textContent='Registrar ganhadora';toast('Não foi possível registrar agora.','err')});return}
  var next=clone(state);next.winners.push({n:cur.n,nome:cur.nome,ig:cur.ig||'',t:Date.now()});
  $('#save').textContent='Salvando…';
  save(next).then(function(r){$('#save').textContent='Registrar ganhadora';if(r.ok){$('#save').style.display='none';renderSorteio();renderLeads();toast(cur.nome+' registrada como ganhadora')}else toast(r.conflict?'A página foi atualizada — registre de novo.':'Não foi possível registrar agora.',r.conflict?'info':'err')});
}

/* QR code */
function autoUrl(){try{var h=location.hostname;if(/^https?:$/.test(location.protocol)&&h&&!/claude|anthropic|usercontent|localhost|^127\./.test(h))return location.origin+location.pathname}catch(e){}return ''}
function qrLink(){return state.qrUrl||autoUrl()}
function paintQR(){var u=qrLink();
  $('#qrBox').innerHTML=u?QR.svg(u,'#111','#fff'):'<div class="qrempty">Toque em “Alterar link” e cole o endereço onde esta página está publicada.</div>';
  $('#qrUrl').textContent=u?u.replace(/^https?:\/\//,''):'Nenhum link definido';$('#qrCopy').style.display=u?'':'none';
  $('#qrEditBox').classList.toggle('on',!u);$('#qrIn').value=u}
$('#qrBtn').onclick=function(){haptic(6);paintQR();openSheet('#qrSheet')};
$('#qrClose').onclick=function(){closeSheet('#qrSheet')};
$('#qrEdit').onclick=function(){$('#qrEditBox').classList.toggle('on');if($('#qrEditBox').classList.contains('on'))setTimeout(function(){$('#qrIn').focus()},100)};
$('#qrCopy').onclick=function(){var u=qrLink(),p;try{p=navigator.clipboard.writeText(u)}catch(e){p=Promise.reject(e)}Promise.resolve(p).then(function(){toast('Link copiado')},function(){toast('Não deu para copiar — selecione o link','info')})};
$('#qrSave').onclick=function(){var u=$('#qrIn').value.trim();if(u&&!/^https?:\/\//i.test(u))u='https://'+u;
  if(!/^https?:\/\/[^\s.]+\.[^\s]+$/i.test(u)){toast('Digite um link válido, ex.: https://seusite.com','err');return}
  closeSheet('#qrSheet');
  askPin('Alterar link do QR code','Digite o código para salvar o novo link',function(){if(mode==='fb'){FB.F.setDoc(FB.F.doc(FB.db,'config','geral'),{qrUrl:u},{merge:true}).then(function(){state.qrUrl=u;toast('Link do QR code salvo');paintQR();setTimeout(function(){openSheet('#qrSheet')},200)},function(){toast('Não foi possível salvar agora.','err')});return}var next=clone(state);next.qrUrl=u;save(next).then(function(r){if(r.ok){toast('Link do QR code salvo');paintQR();setTimeout(function(){openSheet('#qrSheet')},200)}else toast('Não foi possível salvar agora.','err')})});
};

/* partículas e confete */
(function(){var c=$('#dust'),x=c.getContext('2d'),P=[],W,H,dpr=Math.min(2,window.devicePixelRatio||1);
function rs(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr}rs();addEventListener('resize',rs);
var count=innerWidth<600?26:44;for(var i=0;i<count;i++)P.push({x:Math.random(),y:Math.random(),r:Math.random()*1.5+.4,s:Math.random()*.00025+.00008,a:Math.random()*Math.PI*2});
(function f(){if(!document.hidden){x.clearRect(0,0,W,H);P.forEach(function(p){p.y-=p.s;p.a+=.02;if(p.y<-.02)p.y=1.02;var o=.22+Math.sin(p.a)*.22;x.beginPath();x.arc(p.x*W+Math.sin(p.a*.3)*8,p.y*H,p.r*dpr,0,7);x.fillStyle='rgba(249,217,120,'+o+')';x.fill()})}requestAnimationFrame(f)})()})();
var cf=$('#confetti'),cx=cf.getContext('2d'),C=[],cRun=false;
function confetti(sec){var dpr=Math.min(2,window.devicePixelRatio||1);cf.width=innerWidth*dpr;cf.height=innerHeight*dpr;var cols=['#f9d978','#f4cc60','#ddae39','#ffffff','#fff4cf'],k=innerWidth<600?110:170;
for(var i=0;i<k;i++)C.push({x:cf.width/2+(Math.random()-.5)*cf.width*.3,y:cf.height*.42,vx:(Math.random()-.5)*20*dpr,vy:(-Math.random()*19-6)*dpr,w:(Math.random()*7+4)*dpr,h:(Math.random()*4+2)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[rnd(cols.length)],l:sec*60+Math.random()*60});
if(cRun)return;cRun=true;(function f(){cx.clearRect(0,0,cf.width,cf.height);C=C.filter(function(p){return p.l-->0&&p.y<cf.height+40});C.forEach(function(p){p.vy+=.45*dpr;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.min(1,p.l/40);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});if(C.length)requestAnimationFrame(f);else{cRun=false;cx.clearRect(0,0,cf.width,cf.height)}})()}

/* início */
if(inClaude()){artP.then(function(a){art=a;if(!a)goLocal()})}
else{fbLoad().then(fbStart,function(){toast('Sem conexão com o banco de dados — modo local.','err');artP.then(function(a){art=a;goLocal()})})}
go(0,true);renderLeads();renderSorteio();
var last=ss.get('luaday-last'),draft=null;try{draft=JSON.parse(ss.get('luaday-draft')||'null')}catch(e){}
var mine=last&&state.leads.filter(function(l){return l.tel===last})[0];
if(mine){ss.del('luaday-draft');showTicket(mine,false)}
else if(draft){fN.value=draft.nome||'';fT.value=draft.tel||'';fI.value=draft.ig||'';fields.forEach(syncClr);go(2,true);toast('Quase lá! Confirme de novo para gerar seu número.','info')}
try{if(location.hash&&location.hash!=='#participar')history.replaceState(null,'','#participar')}catch(e){}

requestAnimationFrame(moveHL);setTimeout(moveHL,400);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(moveHL);
})();
</script>
